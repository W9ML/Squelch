[Unit]
# Don't touch CUDA until the NVIDIA driver + persistence daemon have brought the
# GPU up, so the UVM device node can actually be created (avoids racing a
# still-initializing driver on a cold boot).
After=nvidia-persistenced.service systemd-modules-load.service
Wants=nvidia-persistenced.service

[Service]
# Some boots load the driver but never create /dev/nvidia-uvm, so faster-whisper
# dies with "CUDA failed with error unknown error" and nothing transcribes.
# Create + VERIFY it before start, retrying while the driver settles. Runs as
# root (+). Non-fatal by design (the helper always exits 0) so a genuinely dead
# GPU still lets the web UI come up — the failure is logged loudly instead of
# silently swallowed. (Replaces the old single-shot `nvidia-modprobe || true`.)
ExecStartPre=
ExecStartPre=+/usr/local/bin/nvidia-uvm-ensure
